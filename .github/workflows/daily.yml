name: Daily data and iPhone app

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # 08:30 UTC = 16:30 China Standard Time, Monday to Friday.
    - cron: "30 8 * * 1-5"
    # 10:00 UTC = 18:00 China Standard Time every Friday.
    - cron: "0 10 * * 5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install report dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Refresh daily report
        shell: bash
        run: |
          if [ "${{ github.event.schedule }}" = "0 10 * * 5" ]; then
            node refresh.js --tenders-only
          elif [ "${{ github.event.schedule }}" = "30 8 * * 1-5" ]; then
            node refresh.js --market-only
          else
            node refresh.js
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload mobile app
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
